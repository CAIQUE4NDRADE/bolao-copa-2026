async function sbGet(tabela, params='') {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${tabela}?${params}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  return r.json();
}

let rankingAnterior = [];
let primeiraVez = true;

async function carregar() {
  try {
    const [palpites, resultados] = await Promise.all([
      sbGet('palpites','order=created_at.asc'),
      sbGet('resultados','order=jogo_num.asc')
    ]);

    const resMap = {};
    if (Array.isArray(resultados)) {
      resultados.forEach(r => { resMap[r.jogo_num] = {g1:r.gol1, g2:r.gol2}; });
    }
    const jogosComRes = Object.keys(resMap).length;

    if (!Array.isArray(palpites) || palpites.length === 0) {
      document.getElementById('conteudo').innerHTML =
        '<div class="loading" style="padding:50px;color:var(--fraco)">⏳ Nenhum palpite registrado ainda.</div>';
      document.getElementById('stPart').textContent = '0';
      document.getElementById('stJogos').textContent = jogosComRes+'/72';
      document.getElementById('stArrecadado').textContent = 'R$0';
      atualizarHora();
      return;
    }

    const ranking = palpites.map(p => {
      let pts=0, feitos=0, acertos3=0, acertos1=0;
      for (let num=1; num<=TOTAL_JOGOS; num++) {
        const g1=p[`j${num}_casa`], g2=p[`j${num}_fora`];
        if (g1===null||g1===undefined) continue;
        feitos++;
        const r=resMap[num];
        if (!r) continue;
        if (g1===r.g1&&g2===r.g2) {pts+=3;acertos3++;continue;}
        const rp=g1>g2?1:g1<g2?-1:0, rr=r.g1>r.g2?1:r.g1<r.g2?-1:0;
        if (rp===rr) {pts+=1;acertos1++;}
      }
      return {nome:p.nome, pts, feitos, acertos3, acertos1, id:p.id, palpites:p};
    }).sort((a,b)=>b.pts-a.pts||b.acertos3-a.acertos3||b.acertos1-a.acertos1);

    // detecta mudanças de posição
    if (!primeiraVez && rankingAnterior.length > 0) {
      ranking.forEach((p,i) => {
        const antIdx = rankingAnterior.findIndex(a=>a.id===p.id);
        if (antIdx > i) {
          mostrarNotif(`🔺 ${p.nome} subiu para ${i+1}º lugar!`);
        }
      });
    }
    rankingAnterior = ranking.map(p=>({...p}));
    primeiraVez = false;

    const maxPts = jogosComRes>0 ? jogosComRes*3 : 1;
    const arrecadado = (palpites.length*20).toLocaleString('pt-BR',{minimumFractionDigits:2});
    const totalR = palpites.length*20;
    const pr1=(totalR*.50).toLocaleString('pt-BR',{minimumFractionDigits:2});
    const pr2=(totalR*.35).toLocaleString('pt-BR',{minimumFractionDigits:2});
    const pr3=(totalR*.15).toLocaleString('pt-BR',{minimumFractionDigits:2});

    document.getElementById('stPart').textContent = palpites.length;
    document.getElementById('stJogos').textContent = jogosComRes+'/72';
    document.getElementById('stArrecadado').textContent = 'R$'+arrecadado;

    const medalhas=['🥇','🥈','🥉'];
    const podioCls=['p1','p2','p3'];
    const premios=[pr1,pr2,pr3];
    const ordemVisual = ranking.length>=3
      ? [{p:ranking[1],i:1},{p:ranking[0],i:0},{p:ranking[2],i:2}]
      : ranking.length===2
      ? [{p:ranking[1],i:1},{p:ranking[0],i:0}]
      : [{p:ranking[0],i:0}];

    let podioHTML = ordemVisual.filter(x=>x.p).map(({p,i}) => `
      <div class="pc ${podioCls[i]}">
        <div class="medal">${medalhas[i]}</div>
        ${renderAvatarPodio(p, `background:${CORES_AV[ranking.indexOf(p)%CORES_AV.length]}`)}
        <div class="pnome">${p.nome}</div>
        <div class="ppts">${p.pts}</div>
        <div class="psub">${p.acertos3} exatos · ${p.acertos1} result.</div>
        <div class="ppremio">R$ ${premios[i]}</div>
      </div>`).join('');

    const liberado = palpitesLiberados();
    const bloqueioMsg = `<div class="palpites-lock"><span>🔒</span>Palpites revelados após 11/06 às 16h01</div>`;

    let tabelaHTML = ranking.map((p,i) => {
      const pct = Math.min(100, maxPts>0?(p.pts/maxPts*100):0);
      const cls = i===0?'gold':i===1?'silver':i===2?'bronze':'';
      const pos = i<3 ? `<span style="font-size:1.4rem">${medalhas[i]}</span>` : (i+1)+'º';
      const falta = i===0
        ? `<span class="r-falta lider">Líder ✓</span>`
        : `<span class="r-falta">-${ranking[0].pts-p.pts} pts<br>pro 1º</span>`;
      const barraColor = i===0?'linear-gradient(90deg,#009c3b,#ffdf00)'
        :i===1?'linear-gradient(90deg,#757575,#9e9e9e)'
        :i===2?'linear-gradient(90deg,#cd7f32,#e0a060)'
        :'linear-gradient(90deg,#002776,#1565c0)';

      let palpitesHTML = '';
      if (!liberado) {
        palpitesHTML = bloqueioMsg;
      } else {
        const itens = JOGOS.map(([num,data,hora,t1,t2,grupo]) => {
          const g1=p.palpites[`j${num}_casa`], g2=p.palpites[`j${num}_fora`];
          if (g1===null||g1===undefined) return '';
          const res=resMap[num];
          let cls2='sem', score=`${g1}–${g2}`;
          if (res) {
            if (g1===res.g1&&g2===res.g2) cls2='ok3';
            else {
              const rp=g1>g2?1:g1<g2?-1:0, rr=res.g1>res.g2?1:res.g1<res.g2?-1:0;
              cls2=rp===rr?'ok1':'err';
            }
          }
          return `<div class="pi ${cls2}">
            <span class="pjogo">J${num} Gr.${grupo}</span>
            <span class="ptimes">${t1} × ${t2}</span>
            <span class="pscore">${score}</span>
          </div>`;
        }).join('');
        palpitesHTML = `<div class="palpites-grid">${itens}</div>`;
      }

      return `
      <div class="ranking-row ${cls}" onclick="toggleRow(this)">
        <div class="row-header">
          <div class="r-pos ${i<3?'medal':''}">${pos}</div>
          <div class="r-info-wrap">
            ${renderAvatar(p, CORES_AV[i%CORES_AV.length])}
            <div>
              <div class="r-nome">${p.nome}</div>
              <div class="r-sub">${p.acertos3} exatos · ${p.acertos1} result. · ${p.feitos}/72</div>
            </div>
          </div>
          <div class="r-pts">${p.pts}<span style="font-size:.6rem;color:var(--fraco);display:block;font-family:'Barlow',sans-serif">pts</span></div>
          ${falta}
          <div class="barra-wrap"><div class="barra" style="width:${pct.toFixed(1)}%;${barraColor.replace('linear-gradient','background:linear-gradient')}"></div></div>
        </div>
        <div class="row-palpites">${palpitesHTML}</div>
      </div>`;
    }).join('');

    document.getElementById('conteudo').innerHTML = `
      <div class="podio">${podioHTML}</div>
      <div class="arrecadado" style="margin-top:12px">
        <span>💰 Total arrecadado (${palpites.length} cotas × R$ 20,00)</span>
        <span>R$ ${arrecadado}</span>
      </div>
      <div class="sec-label">Classificação completa ${liberado ? '· clique para ver palpites' : '· palpites bloqueados até 11/06 às 16h01'}</div>
      ${tabelaHTML}
      <button class="share-btn" onclick="compartilhar()">📲 COMPARTILHAR RANKING NO WHATSAPP</button>`;

    atualizarHora();
  } catch(e) {
    document.getElementById('conteudo').innerHTML =
      '<div class="loading">❌ Erro ao carregar. Tente recarregar.</div>';
  }
}

function toggleRow(row) {
  const palpDiv = row.querySelector('.row-palpites');
  if (palpDiv) palpDiv.classList.toggle('open');
}

function mostrarNotif(msg) {
  const box = document.getElementById('notifBox');
  document.getElementById('notifMsg').innerHTML = msg;
  box.style.display = 'block';
  setTimeout(()=>{ box.style.display='none'; }, 6000);
}

function compartilhar() {
  const url = 'https://caique4ndrade.github.io/bolao-copa-2026/ranking.html';
  const msg = encodeURIComponent(`🏆 Bolão Copa 2026 – Paulínia\n\nConfira a classificação ao vivo:\n${url}\n\n🇧🇷⚽🔥`);
  window.open(`https://wa.me/?text=${msg}`, '_blank');
}

function atualizarHora() {
  document.getElementById('updateInfo').textContent =
    'Última atualização: ' + new Date().toLocaleString('pt-BR') + ' · Atualiza a cada 30s';
}

carregar();
setInterval(carregar, 30000);
</script>
</body>
</html>
