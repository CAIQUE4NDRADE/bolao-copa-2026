<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Admin – Bolão Copa 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --verde:#009c3b; --amarelo:#ffdf00; --azul:#002776;
  --escuro:#1a1a2e; --card:#0f3460; --texto:#e8e8e8;
  --fraco:#9aa0b4; --borda:rgba(255,255,255,0.08);
  --vermelho:#e53935;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Barlow',sans-serif;background:var(--escuro);color:var(--texto);min-height:100vh}

/* LOGIN */
.login-overlay{position:fixed;inset:0;background:var(--escuro);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);border:1px solid rgba(255,223,0,0.3);border-radius:20px;padding:40px 32px;max-width:380px;width:100%;text-align:center}
.login-box .emoji{font-size:3rem;margin-bottom:12px}
.login-box h2{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--amarelo);letter-spacing:3px;margin-bottom:6px}
.login-box p{color:var(--fraco);font-size:.85rem;margin-bottom:24px}
.login-box input{width:100%;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.15);border-radius:10px;padding:12px 16px;color:var(--texto);font-size:1rem;font-family:'Barlow',sans-serif;outline:none;margin-bottom:12px;text-align:center;letter-spacing:3px}
.login-box input:focus{border-color:var(--amarelo)}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,var(--verde),#007a2f);color:#fff;border:none;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:3px;cursor:pointer;transition:all .2s}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,156,59,.3)}
.login-erro{color:var(--vermelho);font-size:.85rem;margin-top:8px;display:none}

/* MAIN */
.main{display:none}
header{background:linear-gradient(135deg,var(--azul),#001a5c,var(--verde));padding:22px 20px 16px;text-align:center;border-bottom:3px solid var(--amarelo);position:relative}
header h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.5rem,4vw,2.4rem);color:var(--amarelo);letter-spacing:3px}
header p{color:rgba(255,255,255,.7);font-size:.8rem;margin-top:3px}
.btn-logout{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.78rem;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px}
.btn-logout:hover{background:rgba(255,255,255,.15);color:#fff}

.tabs{display:flex;gap:0;max-width:1100px;margin:20px auto 0;padding:0 16px}
.tab{padding:10px 22px;background:rgba(255,255,255,.05);border:1px solid var(--borda);border-bottom:none;border-radius:10px 10px 0 0;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:.95rem;letter-spacing:1px;transition:all .2s}
.tab.active{background:var(--card);color:var(--amarelo);font-weight:700}
.tab-content{display:none;max-width:1100px;margin:0 auto;padding:16px 16px 60px;background:var(--card);border-radius:0 10px 10px 10px;border:1px solid var(--borda)}
.tab-content.active{display:block}

/* RESULTADOS */
.res-rodada{background:var(--verde);padding:8px 14px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:2px;margin:12px 0 6px}
.res-rodada.r2{background:var(--amarelo);color:#333}
.res-rodada.r3{background:var(--vermelho)}
.res-jogo{display:grid;grid-template-columns:36px 74px 56px 1fr auto 1fr;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid var(--borda);border-radius:8px;padding:7px 12px;margin-bottom:5px}
.res-num{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--fraco);text-align:center}
.res-data,.res-hora{font-size:.75rem;color:var(--fraco)}
.res-time{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.88rem}
.res-time.fora{text-align:right}
.res-placar{display:flex;align-items:center;gap:5px;justify-content:center}
.res-placar input{width:46px;height:42px;text-align:center;font-size:1.3rem;font-weight:700;font-family:'Bebas Neue',sans-serif;background:rgba(255,255,255,.08);border:2px solid rgba(229,57,53,.4);border-radius:8px;color:var(--vermelho);outline:none}
.res-placar input:focus{border-color:var(--vermelho);background:rgba(229,57,53,.1)}
.res-placar input.salvo{border-color:var(--verde);color:var(--verde)}
.btn-limpar-jogo{background:rgba(229,57,53,.15);border:1px solid rgba(229,57,53,.35);color:var(--vermelho);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:.8rem;transition:all .2s;flex-shrink:0}
.btn-limpar-jogo:hover{background:rgba(229,57,53,.35)}
.res-sep{font-family:'Bebas Neue',sans-serif;color:var(--fraco)}
.btn-salvar-res{background:var(--verde);color:#fff;border:none;padding:10px 24px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:1rem;letter-spacing:1px;cursor:pointer;transition:all .2s}
.btn-salvar-res:hover{background:#007a2f}
.btn-buscar-api{background:rgba(0,39,118,0.6);color:#fff;border:1px solid rgba(100,149,237,0.5);padding:10px 24px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:1rem;letter-spacing:1px;cursor:pointer;transition:all .2s}
.btn-buscar-api:hover{background:rgba(0,39,118,0.9);border-color:var(--amarelo)}

/* PALPITES */
.palpites-header{display:flex;align-items:center;gap:12px;padding:16px 0 10px;flex-wrap:wrap}
.palpites-header h2{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--amarelo);letter-spacing:2px}
.badge-total{background:rgba(255,223,0,.15);border:1px solid var(--amarelo);color:var(--amarelo);padding:4px 14px;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:.85rem}
.btn-refresh{background:transparent;border:1px solid var(--borda);color:var(--fraco);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.82rem;transition:all .2s}
.btn-refresh:hover{border-color:var(--amarelo);color:var(--amarelo)}
.participante-card{background:rgba(255,255,255,.03);border:1px solid var(--borda);border-radius:12px;margin-bottom:8px;overflow:hidden}
.participante-header{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;transition:background .2s}
.participante-header:hover{background:rgba(255,255,255,.04)}
.p-info{display:flex;align-items:center;gap:10px}
.p-nome{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.05rem}
.p-wpp{font-size:.78rem;color:var(--fraco)}
.p-right{display:flex;align-items:center;gap:10px}
.p-pts{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--amarelo)}
.p-pts span{font-size:.65rem;color:var(--fraco);font-family:'Barlow',sans-serif;font-weight:400}
.btn-deletar{background:rgba(229,57,53,.15);border:1px solid rgba(229,57,53,.4);color:var(--vermelho);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.78rem;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;transition:all .2s}
.btn-deletar:hover{background:rgba(229,57,53,.3)}
.p-palpites{display:none;padding:0 16px 12px;border-top:1px solid var(--borda)}
.p-palpites.open{display:block}
.palpites-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:5px;margin-top:10px}
.palpite-item{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.03);border-radius:6px;padding:5px 10px;font-size:.8rem}
.palpite-item .p-jogo{color:var(--fraco);font-size:.7rem;min-width:48px}
.palpite-item .p-times{flex:1;text-align:center;font-family:'Barlow Condensed',sans-serif}
.palpite-item .p-score{font-family:'Bebas Neue',sans-serif;font-size:1.05rem;color:var(--amarelo);min-width:38px;text-align:right}
.palpite-item.acerto3{border-left:3px solid var(--verde)}
.palpite-item.acerto1{border-left:3px solid var(--amarelo)}
.palpite-item.erro{border-left:3px solid var(--vermelho)}
.palpite-item.sem-resultado{border-left:3px solid var(--borda)}

/* RANKING */
.ranking-header{padding:16px 0 10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.ranking-header h2{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--amarelo);letter-spacing:2px}
.btn-calcular{background:var(--verde);color:#fff;border:none;padding:11px 26px;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;cursor:pointer;transition:all .2s}
.btn-calcular:hover{background:#007a2f;transform:translateY(-1px)}
.ranking-table{width:100%;border-collapse:collapse;margin-top:8px}
.ranking-table th{background:rgba(255,255,255,.06);padding:10px 14px;text-align:left;font-family:'Barlow Condensed',sans-serif;font-size:.83rem;letter-spacing:1px;color:var(--fraco);border-bottom:1px solid var(--borda)}
.ranking-table td{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.04)}
.ranking-table tr:hover td{background:rgba(255,255,255,.02)}
.rank-pos{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;text-align:center}
.rank-nome{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem}
.rank-pts{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--amarelo);text-align:center}
.rank-feitos{text-align:center;color:var(--fraco);font-size:.83rem}
.tr-gold td{background:rgba(255,215,0,.07)}
.tr-silver td{background:rgba(192,192,192,.05)}
.tr-bronze td{background:rgba(205,127,50,.05)}
.arrecadado{background:rgba(0,156,59,.1);border:1px solid rgba(0,156,59,.3);border-radius:10px;padding:13px 18px;margin-top:14px;display:flex;align-items:center;justify-content:space-between}
.arrecadado span:first-child{color:var(--fraco);font-size:.83rem}
.arrecadado span:last-child{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;color:var(--verde)}

.loading{text-align:center;padding:40px;color:var(--fraco)}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--borda);border-top-color:var(--verde);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .res-jogo{grid-template-columns:28px 1fr auto 1fr;gap:4px}
  .res-data,.res-hora{display:none}
  .tabs{overflow-x:auto}
  .tab{white-space:nowrap;font-size:.8rem;padding:8px 14px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="emoji">🔐</div>
    <h2>Área Admin</h2>
    <p>Bolão Copa do Mundo 2026 – Paulínia</p>
    <input type="password" id="senhaInput" placeholder="Digite a senha" onkeydown="if(event.key==='Enter')fazerLogin()">
    <button class="btn-login" onclick="fazerLogin()">🏆 ENTRAR</button>
    <div class="login-erro" id="loginErro">❌ Senha incorreta</div>
  </div>
</div>

<!-- MAIN -->
<div class="main" id="mainContent">

<header>

<div class="tabs">

</div>

<!-- PALPITES -->
<div class="tab-content" id="tab-palpites">

  </div>
  <div id="palpitesContainer"><div class="loading"><div class="spinner"></div><br>Carregando...</div></div>
</div>

<!-- RANKING -->
<div class="tab-content" id="tab-ranking">
  <div class="ranking-header">
    <h2>Classificação Geral</h2>
    <button class="btn-calcular" onclick="calcularRanking()">⚽ Calcular Pontos</button>
  </div>
  <div id="rankingContainer"><div class="loading"><div class="spinner"></div><br>Clique em "Calcular Pontos"</div></div>
</div>

</div><!-- /main -->

// ── LOGIN ─────────────────────────────────────────────────────
function fazerLogin() {
  const v = document.getElementById('senhaInput').value;
  if (v === SENHA_HASH) {
    sessionStorage.setItem('admin_ok','1');
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    renderResultados();
  } else {
    document.getElementById('loginErro').style.display = 'block';
    document.getElementById('senhaInput').value = '';
    document.getElementById('senhaInput').focus();
  }
}

function fazerLogout() {
  sessionStorage.removeItem('admin_ok');
  location.reload();
}

// verifica sessão ao carregar
window.addEventListener('load', () => {
  if (sessionStorage.getItem('admin_ok') === '1') {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    renderResultados();
  }
});

// ── UTILS ─────────────────────────────────────────────────────
async function sbGet(tabela, params='') {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${tabela}?${params}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  return r.json();
}

async function sbUpsert(tabela, data) {
  return fetch(`${SUPABASE_URL}/rest/v1/${tabela}`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'
    },
    body: JSON.stringify(data)
  });
}

async function sbDelete(tabela, id) {
  return fetch(`${SUPABASE_URL}/rest/v1/${tabela}?id=eq.${id}`, {
    method: 'DELETE',
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
}

// ── TABS ──────────────────────────────────────────────────────
function abrirTab(nome, el) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + nome).classList.add('active');
  el.classList.add('active');
  if (nome === 'palpites') carregarPalpites();
  if (nome === 'resultados') renderResultados();
}

// ── RESULTADOS ────────────────────────────────────────────────

  const dados = await sbGet('resultados', 'order=jogo_num.asc');
  if (Array.isArray(dados)) {
    dados.forEach(d => { resultadosSalvos[d.jogo_num] = { g1: d.gol1, g2: d.gol2 }; });
  }
  const grid = document.getElementById('resultadosGrid');
  const rodNomes = ['','🟢 1ª RODADA – 11 a 17/Jun','🟡 2ª RODADA – 18 a 23/Jun','🔴 3ª RODADA – 24 a 27/Jun'];
  const rodCls   = ['','','r2','r3'];
  let html = '', rodAtual = 0;
  JOGOS.forEach(([num,data,hora,t1,t2,grupo], idx) => {
    const rod = idx < 24 ? 1 : idx < 48 ? 2 : 3;
    if (rod !== rodAtual) {
      rodAtual = rod;
      html += `<div class="res-rodada ${rodCls[rod]}">${rodNomes[rod]}</div>`;
    }
    const r  = resultadosSalvos[num] || {};
    const v1 = r.g1 !== undefined ? r.g1 : '';
    const v2 = r.g2 !== undefined ? r.g2 : '';
    html += `<div class="res-jogo">
      <div class="res-num">${num}</div>
      <div class="res-data">${data}</div>
      <div class="res-hora">${hora}</div>
      <div class="res-time">${t1}</div>
      <div class="res-placar">
        <input type="number" id="r${num}_g1" min="0" max="20" value="${v1}" class="${v1!=='' ? 'salvo' : ''}" placeholder="–">
        <span class="res-sep">×</span>
        <input type="number" id="r${num}_g2" min="0" max="20" value="${v2}" class="${v2!=='' ? 'salvo' : ''}" placeholder="–">
        <button class="btn-limpar-jogo" title="Limpar resultado" onclick="limparResultado(${num})">✕</button>
      </div>
      <div class="res-time fora">${t2}</div>
    </div>`;
  });
  grid.innerHTML = html;
}

async function salvarResultados() {
  const btn = document.querySelector('.btn-salvar-res');
  btn.textContent = '⏳ Salvando...'; btn.disabled = true;
  const lote = [];
  JOGOS.forEach(([num]) => {
    const g1 = document.getElementById(`r${num}_g1`)?.value;
    const g2 = document.getElementById(`r${num}_g2`)?.value;
    if (g1 !== '' && g2 !== '' && g1 !== undefined && g2 !== undefined)
      lote.push({ jogo_num: num, gol1: parseInt(g1), gol2: parseInt(g2) });
  });
  const r = await sbUpsert('resultados', lote);
  if (r.ok || r.status === 201) {
    lote.forEach(l => {
      document.getElementById(`r${l.jogo_num}_g1`)?.classList.add('salvo');
      document.getElementById(`r${l.jogo_num}_g2`)?.classList.add('salvo');
      resultadosSalvos[l.jogo_num] = { g1: l.gol1, g2: l.gol2 };
    });
    alert(`✅ ${lote.length} resultados salvos!`);
  } else {
    alert('Erro: ' + await r.text());
  }
  btn.textContent = '💾 Salvar Resultados'; btn.disabled = false;
}

// ── PALPITES ──────────────────────────────────────────────────
async function carregarPalpites() {
  document.getElementById('palpitesContainer').innerHTML =
    '<div class="loading"><div class="spinner"></div><br>Carregando...</div>';
  const dados = await sbGet('palpites', 'order=created_at.asc');
  if (!Array.isArray(dados) || dados.length === 0) {
    document.getElementById('palpitesContainer').innerHTML =
      '<div class="loading">Nenhum palpite ainda.</div>';
    document.getElementById('badgeTotal').textContent = '0 participantes';
    return;
  }
  document.getElementById('badgeTotal').textContent = dados.length + ' participante(s)';
  let html = '';
  dados.forEach(p => {
    const itens = JOGOS.map(([num,data,hora,t1,t2,grupo]) => {
      const g1 = p[`j${num}_casa`];
      const g2 = p[`j${num}_fora`];
      if (g1 === null || g1 === undefined) return '';
      const res = resultadosSalvos[num];
      let cls = 'sem-resultado';
      if (res !== undefined) {
        if (g1 === res.g1 && g2 === res.g2) cls = 'acerto3';
        else {
          const rp = g1>g2?1:g1<g2?-1:0;
          const rr = res.g1>res.g2?1:res.g1<res.g2?-1:0;
          cls = rp===rr ? 'acerto1' : 'erro';
        }
      }
      return `<div class="palpite-item ${cls}">
        <span class="p-jogo">J${num} Gr.${grupo}</span>
        <span class="p-times">${t1} × ${t2}</span>
        <span class="p-score">${g1}–${g2}</span>
      </div>`;
    }).join('');

    const data_fmt = p.created_at ? new Date(p.created_at).toLocaleString('pt-BR') : '';
    html += `
    <div class="participante-card" id="card_${p.id}">
      <div class="participante-header" onclick="togglePalpite(this)">
        <div class="p-info">
          <div>
            <div class="p-nome">${p.nome}</div>
            <div class="p-wpp">${p.whatsapp || ''} · ${data_fmt}</div>
          </div>
        </div>
        <div class="p-right">
          <div class="p-pts" id="pts_${p.id}">– <span>pts</span></div>
          <button class="btn-deletar" onclick="deletarPalpite(event,${p.id},'${p.nome}')">🗑 Deletar</button>
        </div>
      </div>
      <div class="p-palpites">
        <div class="palpites-lista">${itens}</div>
      </div>
    </div>`;
  });
  document.getElementById('palpitesContainer').innerHTML = html;
}

function togglePalpite(el) {
  el.nextElementSibling.classList.toggle('open');
}

async function deletarPalpite(event, id, nome) {
  event.stopPropagation();
  if (!confirm(`Deletar os palpites de "${nome}"?\n\nEssa ação não pode ser desfeita.`)) return;
  const r = await sbDelete('palpites', id);
  if (r.ok || r.status === 204) {
    document.getElementById('card_' + id)?.remove();
    const total = document.querySelectorAll('.participante-card').length;
    document.getElementById('badgeTotal').textContent = total + ' participante(s)';
    alert(`✅ Palpites de "${nome}" deletados.`);
  } else {
    alert('Erro ao deletar: ' + await r.text());
  }
}

// ── RANKING ───────────────────────────────────────────────────
async function calcularRanking() {
  const btn = document.querySelector('.btn-calcular');
  btn.textContent = '⏳ Calculando...'; btn.disabled = true;
  const res = await sbGet('resultados', 'order=jogo_num.asc');
  const resMap = {};
  if (Array.isArray(res)) res.forEach(r => { resMap[r.jogo_num] = { g1: r.gol1, g2: r.gol2 }; });
  const palpites = await sbGet('palpites', 'order=created_at.asc');
  if (!Array.isArray(palpites) || palpites.length === 0) {
    document.getElementById('rankingContainer').innerHTML =
      '<div class="loading">Nenhum palpite recebido ainda.</div>';
    btn.textContent = '⚽ Calcular Pontos'; btn.disabled = false;
    return;
  }
  const jogosComRes = Object.keys(resMap).length;
  const ranking = palpites.map(p => {
    let pts = 0, feitos = 0, acertos3 = 0, acertos1 = 0;
    JOGOS.forEach(([num]) => {
      const g1 = p[`j${num}_casa`];
      const g2 = p[`j${num}_fora`];
      if (g1 === null || g1 === undefined) return;
      feitos++;
      const r = resMap[num];
      if (!r) return;
      if (g1===r.g1 && g2===r.g2) { pts+=3; acertos3++; return; }
      const rp = g1>g2?1:g1<g2?-1:0;
      const rr = r.g1>r.g2?1:r.g1<r.g2?-1:0;
      if (rp===rr) { pts+=1; acertos1++; }
    });
    return { nome: p.nome, wpp: p.whatsapp||'', pts, feitos, acertos3, acertos1, id: p.id };
  }).sort((a,b) => b.pts - a.pts || b.acertos3 - a.acertos3 || b.acertos1 - a.acertos1);

  ranking.forEach(p => {
    const el = document.getElementById('pts_'+p.id);
    if (el) el.innerHTML = `${p.pts} <span>pts</span>`;
  });

  const medalhas = ['🥇','🥈','🥉'];
  const trCls    = ['tr-gold','tr-silver','tr-bronze'];
  const rows = ranking.map((p,i) => `
    <tr class="${trCls[i]||''}">
      <td class="rank-pos">${medalhas[i]||((i+1)+'º')}</td>
      <td><div class="rank-nome">${p.nome}</div><div style="font-size:.75rem;color:var(--fraco)">${p.wpp}</div></td>
      <td class="rank-pts">${p.pts}</td>
      <td class="rank-feitos">${p.acertos3||0} exatos</td>
      <td class="rank-feitos">${p.acertos1||0} result.</td>
      <td class="rank-feitos">${p.feitos}/72</td>
      <td class="rank-feitos">${jogosComRes>0?(p.pts/(jogosComRes*3)*100).toFixed(1)+'%':'-'}</td>
    </tr>`).join('');

  const arrecadado = (ranking.length*20).toLocaleString('pt-BR',{minimumFractionDigits:2});
  document.getElementById('rankingContainer').innerHTML = `
    <table class="ranking-table">
      <thead><tr>
        <th>Pos.</th><th>Participante</th>
        <th style="text-align:center">Pontos</th>
        <th style="text-align:center">Placares Exatos</th>
        <th style="text-align:center">Resultados</th>
        <th style="text-align:center">Palpites</th>
        <th style="text-align:center">Aproveit.</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="arrecadado">
      <span>💰 Total arrecadado (${ranking.length} cotas × R$ 20,00)</span>
      <span>R$ ${arrecadado}</span>
    </div>`;
  btn.textContent = '⚽ Calcular Pontos'; btn.disabled = false;
}


// ── BUSCAR RESULTADOS VIA API FOOTBALL ───────────────────────
const API_FOOTBALL_KEY = '928d2a7c01ba49c4e94519284b86daa0';
const WC_LEAGUE = 1;
const WC_SEASON = 2026;

// Mapa: [time1, time2] → jogo_num (para matching)
const JOGOS_MAP = {};
JOGOS.forEach(([num,data,hora,t1,t2,grupo]) => {
  const key = `${t1.toLowerCase()}|${t2.toLowerCase()}`;
  JOGOS_MAP[key] = num;
});

// Normaliza nomes para comparação com a API
function normalizarTime(nome) {
  const mapa = {
    'méxico': 'mexico', 'brasil': 'brazil', 'alemanha': 'germany',
    'holanda': 'netherlands', 'espanha': 'spain', 'frança': 'france',
    'bélgica': 'belgium', 'inglaterra': 'england', 'portugal': 'portugal',
    'argentina': 'argentina', 'coreia do sul': 'south korea',
    'arábia saudita': 'saudi arabia', 'nova zelândia': 'new zealand',
    'costa do marfim': 'ivory coast', 'áfrica do sul': 'south africa',
    'rep. checa': 'czech republic', 'bósnia e herz.': 'bosnia',
    'rep. d. congo': 'dr congo', 'uzbequistão': 'uzbekistan',
    'irã': 'iran', 'austrália': 'australia', 'áustria': 'austria',
    'argélia': 'algeria', 'jordânia': 'jordan', 'japão': 'japan',
    'colômbia': 'colombia', 'equador': 'ecuador', 'noruega': 'norway',
    'curaçao': 'curacao', 'tunísia': 'tunisia', 'croácia': 'croatia',
    'gana': 'ghana', 'panamá': 'panama', 'uruguai': 'uruguay',
    'egito': 'egypt', 'senegal': 'senegal', 'suíça': 'switzerland',
    'suécia': 'sweden', 'escócia': 'scotland', 'haiti': 'haiti',
    'catar': 'qatar', 'canadá': 'canada', 'iraque': 'iraq',
    'marrocos': 'morocco', 'cabo verde': 'cape verde',
    'paraguai': 'paraguay', 'turquia': 'turkey',
  };
  const n = nome.toLowerCase();
  return mapa[n] || n;
}

async function buscarResultadosAPI() {
  const btn = document.querySelector('.btn-buscar-api');
  const status = document.getElementById('apiStatus');
  btn.disabled = true;
  btn.textContent = '⏳ Buscando...';
  status.textContent = '';

  try {
    // Busca jogos finalizados da Copa 2026
    const url = `https://v3.football.api-sports.io/fixtures?league=${WC_LEAGUE}&season=${WC_SEASON}&status=FT`;
    const resp = await fetch(url, {
      headers: {
        'x-apisports-key': API_FOOTBALL_KEY,
      }
    });

    if (!resp.ok) {
      throw new Error(`API retornou ${resp.status}. Verifique se a chave está ativa.`);
    }

    const data = await resp.json();
    const fixtures = data.response || [];

    if (fixtures.length === 0) {
      status.textContent = '⚠️ Nenhum jogo finalizado encontrado na API ainda.';
      btn.disabled = false;
      btn.textContent = '🔄 Buscar Resultados Automáticos';
      return;
    }

    let encontrados = 0;
    let lote = [];

    fixtures.forEach(f => {
      const homeAPI = f.teams?.home?.name?.toLowerCase() || '';
      const awayAPI = f.teams?.away?.name?.toLowerCase() || '';
      const goalsHome = f.goals?.home;
      const goalsAway = f.goals?.away;

      if (goalsHome === null || goalsAway === null) return;

      // Tenta fazer match com nossos jogos
      let jogoNum = null;

      // Busca direto
      for (const [num,data,hora,t1,t2,grupo] of JOGOS) {
        const n1 = normalizarTime(t1);
        const n2 = normalizarTime(t2);
        if (
          (homeAPI.includes(n1) || n1.includes(homeAPI)) &&
          (awayAPI.includes(n2) || n2.includes(awayAPI))
        ) {
          jogoNum = num;
          break;
        }
        // invertido
        if (
          (homeAPI.includes(n2) || n2.includes(homeAPI)) &&
          (awayAPI.includes(n1) || n1.includes(awayAPI))
        ) {
          jogoNum = num;
          break;
        }
      }

      if (jogoNum) {
        lote.push({ jogo_num: jogoNum, gol1: goalsHome, gol2: goalsAway });
        encontrados++;
      }
    });

    if (lote.length === 0) {
      status.textContent = `⚠️ ${fixtures.length} jogos encontrados na API mas nenhum correspondeu. Os jogos podem ainda não ter começado.`;
      btn.disabled = false;
      btn.textContent = '🔄 Buscar Resultados Automáticos';
      return;
    }

    // Salva no Supabase
    const r = await sbUpsert('resultados', lote);
    if (r.ok || r.status === 201) {
      // Atualiza tela
      lote.forEach(l => {
        resultadosSalvos[l.jogo_num] = { g1: l.gol1, g2: l.gol2 };
        const i1 = document.getElementById(`r${l.jogo_num}_g1`);
        const i2 = document.getElementById(`r${l.jogo_num}_g2`);
        if (i1) { i1.value = l.gol1; i1.classList.add('salvo'); }
        if (i2) { i2.value = l.gol2; i2.classList.add('salvo'); }
      });
      status.textContent = `✅ ${encontrados} resultado(s) importados automaticamente!`;
      status.style.color = '#4caf50';
    } else {
      throw new Error('Erro ao salvar no banco: ' + await r.text());
    }

  } catch(e) {
    status.textContent = `❌ ${e.message}`;
    status.style.color = '#ef5350';
  }

  btn.disabled = false;
  btn.textContent = '🔄 Buscar Resultados Automáticos';
}

// ── LIMPAR RESULTADO INDIVIDUAL ───────────────────────────────
async function limparResultado(num) {
  if (!confirm(`Limpar resultado do jogo ${num}?`)) return;
  const r = await fetch(`${SUPABASE_URL}/rest/v1/resultados?jogo_num=eq.${num}`, {
    method: 'DELETE',
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  if (r.ok || r.status === 204) {
    const i1 = document.getElementById(`r${num}_g1`);
    const i2 = document.getElementById(`r${num}_g2`);
    if (i1) { i1.value = ''; i1.classList.remove('salvo'); }
    if (i2) { i2.value = ''; i2.classList.remove('salvo'); }
    delete resultadosSalvos[num];
  } else {
    alert('Erro ao limpar: ' + await r.text());
  }
}
